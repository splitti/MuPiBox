<div class="oc" [class.oc-solo]="!choosable()" role="group">
  @if (choosable()) {
    <button class="oc-field" type="button" [class.oc-on]="onBox()" (click)="tapBox()" aria-label="Box">
      @if (onJack()) {
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15v-3a8 8 0 0 1 16 0v3" /><rect x="3" y="14" width="5" height="7" rx="1.5" /><rect x="16" y="14" width="5" height="7" rx="1.5" /></svg>
      } @else {
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="2.5" /><circle cx="12" cy="14.5" r="3.5" /><circle cx="12" cy="7" r="1.2" /></svg>
      }
    </button>
    @if (devices().length > 0) {
    <button class="oc-field" type="button" [class.oc-on]="state() === 'bt'" [attr.data-state]="state()" (click)="tapHeadset()" [attr.aria-label]="device()?.name">
      @if (device()?.kind === 'speaker') {
        <svg class="oc-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="3" width="12" height="18" rx="3" /><circle cx="12" cy="14" r="3" /><circle class="fill" cx="12" cy="7.5" r="1" /></svg>
      } @else {
        <svg class="oc-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15v-3a8 8 0 0 1 16 0v3" /><rect x="3" y="14" width="5" height="7" rx="1.5" /><rect x="16" y="14" width="5" height="7" rx="1.5" /></svg>
      }
      @if (state() === 'connecting') {
        <span class="oc-ring"></span>
      }
      @if (state() === 'ready' || state() === 'notfound') {
        <span class="oc-dot"></span>
      }
    </button>
    }
    <span class="oc-sep" aria-hidden="true"></span>
  }
  <span class="oc-vol">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M3 9.2h3.6L11.2 5v14l-4.6-4.2H3z" /><path d="M15 9.5a3.5 3.5 0 0 1 0 5" /></svg>{{ volume() }} %
  </span>
</div>
