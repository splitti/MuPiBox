<ion-content class="medialist-content mupi-page" [scrollY]="false">
  <mupi-status-bar slot="fixed"></mupi-status-bar>

  <header class="album-header" slot="fixed">
    <button type="button" class="header-corner" (click)="goBack()" aria-label="Zurück">
      <img draggable="false" ondragstart="return false;" [src]="artistCover()" alt="">
    </button>
    <h1 class="album-title">{{artist()?.name}}</h1>
  </header>

  <mupi-loading [loading]="isLoading()"></mupi-loading>

  <mupi-tile-pages
    [items]="items()"
    (tileClicked)="coverClicked($event)"
    (labelClicked)="readText($event.title)">
  </mupi-tile-pages>
</ion-content>
