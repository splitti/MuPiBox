<ion-content class="resume-content mupi-page" [scrollY]="false">
  <mupi-status-bar slot="fixed"></mupi-status-bar>

  <header class="album-header" slot="fixed">
    <button type="button" class="header-corner header-back" (click)="goBack()" aria-label="Zurück">
      <ion-icon name="lucide-history"></ion-icon>
    </button>
    <h1 class="album-title">Weiterhören</h1>
  </header>

  <mupi-loading [loading]="isLoading()"></mupi-loading>

  @if (!isLoading() && items().length === 0) {
    <p class="resume-empty">Noch nichts angehört</p>
  }

  <mupi-tile-pages
    [items]="items()"
    (tileClicked)="coverClicked($event)"
    (labelClicked)="readText($event.title)">
  </mupi-tile-pages>
</ion-content>
