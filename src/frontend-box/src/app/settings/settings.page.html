<ion-content class="settings-content mupi-page">
  <mupi-settings-header title="Einstellungen" backHref="/home">
    @let networkVar = network();
    @if (networkVar?.host || networkVar?.ip) {
      <span class="header-meta">{{ networkVar?.host }}@if (networkVar?.host && networkVar?.ip) { &middot; }{{ networkVar?.ip }}</span>
    }
  </mupi-settings-header>

  <div class="settings-card">
    <button type="button" class="settings-row tappable" (click)="openWifi()">
      <ion-icon class="row-icon" [name]="networkVar?.onlinestate === 'online' ? 'lucide-wifi' : 'lucide-wifi-off'"></ion-icon>
      <span class="row-main"><span class="row-title">WLAN</span></span>
      <span class="row-value">{{ networkVar?.wifi || 'Nicht verbunden' }}</span>
      <ion-icon class="row-chevron" name="lucide-chevron-right"></ion-icon>
    </button>

    <button type="button" class="settings-row tappable" (click)="openBluetooth()">
      <ion-icon class="row-icon" name="lucide-bluetooth"></ion-icon>
      <span class="row-main"><span class="row-title">Bluetooth</span></span>
      <span class="row-value">{{ bluetoothText() }}</span>
      <ion-icon class="row-chevron" name="lucide-chevron-right"></ion-icon>
    </button>

    <button type="button" class="settings-row tappable" (click)="openMedia()">
      <ion-icon class="row-icon" name="lucide-square-plus"></ion-icon>
      <span class="row-main"><span class="row-title">Medien hinzufügen</span></span>
      <ion-icon class="row-chevron" name="lucide-chevron-right"></ion-icon>
    </button>

    <button type="button" class="settings-row tappable" (click)="reloadMedia()">
      <ion-icon class="row-icon" name="lucide-refresh-cw"></ion-icon>
      <span class="row-main"><span class="row-title">Medien neu laden</span></span>
      @if (mediaReloading()) {
        <span class="row-value">Wird geladen …</span>
      }
    </button>

    @if (batteryText()) {
      <div class="settings-row">
        <mupihat-icon class="row-icon"></mupihat-icon>
        <span class="row-main"><span class="row-title">Akku</span></span>
        <span class="row-value battery">{{ batteryText() }}</span>
      </div>
    }

    <button type="button" class="settings-row tappable danger" (click)="shutdownMessage()">
      <ion-icon class="row-icon" name="lucide-power"></ion-icon>
      <span class="row-main"><span class="row-title">Neustart / Ausschalten</span></span>
      <ion-icon class="row-chevron" name="lucide-chevron-right"></ion-icon>
    </button>
  </div>
</ion-content>
