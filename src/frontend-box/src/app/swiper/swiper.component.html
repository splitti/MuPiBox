<!-- Cover Flow: the centered cover faces front, the others are tilted in 3D like in Apple's Cover Flow. -->
  <swiper-container #swiper (click)="containerClicked($event)" effect="coverflow" centered-slides="true" slides-per-view="auto" grab-cursor="true" coverflow-effect-rotate="65" coverflow-effect-stretch="-55" coverflow-effect-depth="250" coverflow-effect-modifier="1" coverflow-effect-slide-shadows="false" scrollbar="true" scrollbar-hide="false" scrollbar-draggable="true" scrollbar-drag-size="auto" scrollbar-snap-on-release="true">
    @for (currentData of shownData(); track currentData; let i = $index) {
      <swiper-slide>
        <ion-grid>
          <ion-row class="img-row">
            <ion-col size="12">
              <ion-card [class.circle-card]="roundImages()" (click)="slideClicked(i, currentData)">
                <img draggable="false" ondragstart="return false;" loading="lazy" src="{{currentData.imgSrc | async}}">
              </ion-card>
            </ion-col>
          </ion-row>
          <ion-row class="title-row">
            <ion-col size="12">
              <ion-card (click)="readText(currentData.name)">
                <ion-card-header>
                  <ion-card-title class="ion-text-nowrap truncate-text ion-text-center">{{currentData.name}}</ion-card-title>
                </ion-card-header>
              </ion-card>
            </ion-col>
          </ion-row>
        </ion-grid>
      </swiper-slide>
    }
  </swiper-container>
