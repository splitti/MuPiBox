@if (configLoaded()) {
  @if (coverflow()) {
  <!-- Cover Flow: the centered cover faces front, all others are tilted towards it (see applyCoverflow). -->
    <swiper-container #swiper class="coverflow" (click)="slideClicked($event)" (pointerdown)="fewPointerDown($event)" (pointermove)="fewPointerMove($event)" (pointerup)="fewPointerUp($event)" (pointercancel)="fewPointerUp($event)" (swiperprogress)="applyCoverflow()" (swipersettranslate)="applyCoverflow()" (swiperinit)="applyCoverflow()" watch-slides-progress="true" centered-slides="true" slides-per-view="auto" space-between="-272" grab-cursor="true" touch-ratio="0.67" [attr.scrollbar]="!hideScrollbar()" scrollbar-hide="false" scrollbar-draggable="true" scrollbar-drag-size="auto" scrollbar-snap-on-release="true">
      @for (currentData of shownData(); track currentData) {
        <swiper-slide>
          <ion-grid>
            <ion-row class="img-row">
              <ion-col size="12">
                <ion-card>
                  <img draggable="false" ondragstart="return false;" [attr.data-src]="currentData.imgSrc | async">
                </ion-card>
              </ion-col>
            </ion-row>
          </ion-grid>
          @if (coverflowShowNames()) {
            <!-- Outside ion-grid on purpose: ion-grid has the Cover Flow mirror reflection
                 (-webkit-box-reflect), which would duplicate this text into a faded reflection too. -->
            <div class="coverflow-name">{{currentData.name}}</div>
          }
        </swiper-slide>
      }
    </swiper-container>
  } @else {
  <swiper-container #swiper slides-per-view="3" [attr.scrollbar]="!hideScrollbar()" scrollbar-hide="false" scrollbar-draggable="true" scrollbar-drag-size="auto" scrollbar-snap-on-release="true" free-mode="false" css-mode="true">
      @for (currentData of shownData(); track currentData) {
        <swiper-slide>
          <ion-grid>
            <ion-row class="img-row">
              <ion-col size="12">
                <ion-card [class.circle-card]="roundImages()" (click)="this.elementClicked.emit(currentData)">
                  <img draggable="false" ondragstart="return false;" loading="lazy" src="{{currentData.imgSrc | async}}">
                </ion-card>
              </ion-col>
            </ion-row>
            <ion-row class="title-row">
              <ion-col size="12">
                <ion-card (click)="readText(currentData.name)">
                  <ion-card-header>
                    <ion-card-title class="ion-text-nowrap truncate-text ion-text-center">{{currentData.name}}</ion-card-title>
                  </ion-card-header>
                </ion-card>
              </ion-col>
            </ion-row>
          </ion-grid>
        </swiper-slide>
      }
    </swiper-container>
  }
}
