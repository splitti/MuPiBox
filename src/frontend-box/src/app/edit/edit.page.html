<ion-content class="settings-content mupi-page">
  <mupi-settings-header title="Medien">
    <button type="button" class="btn-outline" (click)="clearResumePressed()">
      <ion-icon name="lucide-history"></ion-icon>
      Weiterhören leeren
    </button>
    <button type="button" class="pill-dark" (click)="addButtonPressed()">
      <ion-icon name="lucide-plus"></ion-icon>
      Hinzufügen
    </button>
  </mupi-settings-header>

  <div class="settings-card">
    @for (item of (media | async); track item.index) {
      <div class="settings-row">
        <ion-icon class="row-icon" [name]="typeIcon(item)"></ion-icon>
        <div class="row-main">
          <div class="row-title">{{ primaryText(item) }}</div>
          <div class="row-sub">{{ detailText(item) }}</div>
        </div>
        <div class="row-actions">
          @if (item.type === 'spotify' || item.type === 'radio' || item.type === 'rss') {
            <button type="button" class="btn-outline icon-only" (click)="editButtonPreddes(item)" aria-label="Bearbeiten">
              <ion-icon name="lucide-pencil"></ion-icon>
            </button>
          }
          <button type="button" class="btn-outline icon-only danger" (click)="deleteButtonPressed(item)" aria-label="Löschen">
            <ion-icon name="lucide-trash-2"></ion-icon>
          </button>
        </div>
      </div>
    } @empty {
      <div class="settings-empty">Noch keine Medien eingerichtet.</div>
    }
  </div>
</ion-content>
