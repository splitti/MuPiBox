<ion-header class="home-header">
  <ion-toolbar color="light">
    <ion-buttons slot="start">
      <ion-button (click)="resume()">
        @if (km()) {
          <svg class="km-resume-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3" /><path d="M4 3.5v4h4" /><path d="M12 8v4.2l2.8 1.8" /></svg>
        } @else {
          <ion-icon slot="icon-only" name="timer-outline"></ion-icon>
        }
      </ion-button>
    </ion-buttons>
    @if (configLoaded()) {
      <!-- Hidden categories are left out; the remaining buttons share the width equally,
           so their icons stay evenly spaced and centered. -->
      <ion-segment value="{{this.category()}}" (ionChange)="categoryChanged($event)">
        @for (cat of visibleCategories(); track cat.key) {
          <ion-segment-button [value]="cat.key">
            <ion-icon [name]="cat.icon"></ion-icon>
          </ion-segment-button>
        }
      </ion-segment>
    }
    
    <ion-buttons slot="end">
      <ion-button class="status-icons" (pointerdown)="settingsButtonPointerDown()" (pointerup)="settingsButtonPointerUp()" (pointerleave)="settingsButtonPointerUp()" (pointercancel)="settingsButtonPointerUp()">
          <mupi-status></mupi-status>
        </ion-button>
      </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="home-content">
  <mupi-loading [loading]="isLoading()"></mupi-loading>
  @if (unavailable()) {
    <mupi-media-unavailable [nas]="category() === 'nas'"></mupi-media-unavailable>
  }
  <mupi-swiper [data]="swiperData()" roundImages="true" (elementClicked)="this.artistCoverClicked($event.data)"></mupi-swiper>
</ion-content>
