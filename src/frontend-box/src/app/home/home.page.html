<ion-content class="home-content mupi-page" [scrollY]="true">
  <!-- Fixed slot: stays on top while the sections scroll underneath. -->
  <mupi-status-bar slot="fixed"></mupi-status-bar>
  <button slot="fixed" type="button" class="resume-pill" (click)="resume()" aria-label="Weiterhören">
    <ion-icon name="lucide-history"></ion-icon>
  </button>

  <div class="sections">
    @for (section of sections; track section.category) {
      <section class="category-section">
        <h2 class="section-title">
          <span>{{section.label}}</span>
          @if (section.isLoading()) {
            <ion-spinner name="crescent" class="section-spinner"></ion-spinner>
          }
        </h2>
        @if (!section.isLoading() && section.tiles().length === 0) {
          <p class="section-empty">Noch nichts eingerichtet</p>
        } @else {
          <div class="tile-row">
            @for (tile of section.tiles(); track tile.artist.name) {
              <mupi-tile
                [imgSrc]="tile.imgSrc"
                [title]="tile.artist.name"
                (tileClicked)="artistCoverClicked(tile.artist, section.category)"
                (labelClicked)="readText(tile.artist.name)">
              </mupi-tile>
            }
          </div>
        }
      </section>
    }
  </div>
</ion-content>
