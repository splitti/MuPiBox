<div class="playtime-blocked-overlay" (click)="$event.stopPropagation()">
  <div class="content">
    @if (km()) {
      <!-- km themes: the theme's mascot asleep, the icon as a badge on it; the texts next to it -->
      <!-- badge as in the design: an hourglass for the day's limit, "Zzz" for a quiet time (also a parent's pause) -->
      <div class="km-mascot-wrap">
        <img [src]="kmMascot()" alt="">
        @if (kmQuiet()) {
          <span class="km-badge-zzz" aria-hidden="true">Zzz</span>
        } @else {
          <ion-icon name="hourglass" class="icon" aria-hidden="true"></ion-icon>
        }
      </div>
    } @else {
      <ion-icon [name]="content().iconName" class="icon" aria-hidden="true"></ion-icon>
    }
    <div>
      <h1>{{ content().heading }}</h1>
      <p>
        <ion-icon name="musical-notes-outline" class="inline-icon" aria-hidden="true"></ion-icon>
        {{ content().subheading }}
        <ion-icon name="musical-notes-outline" class="inline-icon" aria-hidden="true"></ion-icon>
      </p>
    </div>
  </div>
</div>
