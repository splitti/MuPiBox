<div
  class="status-pill"
  (click)="tapped()"
  (pointerdown)="pointerDown()"
  (pointerup)="pointerUp()"
  (pointerleave)="pointerUp()"
  (pointercancel)="pointerUp()"
  (contextmenu)="$event.preventDefault()">
  @if (isOnline()) {
    <ion-icon name="lucide-wifi"></ion-icon>
  } @else {
    <ion-icon name="lucide-wifi-off"></ion-icon>
  }
  <mupihat-icon></mupihat-icon>
</div>
