<ion-content class="settings-content mupi-page wifi-add-content" [scrollY]="false">
  <mupi-settings-header [title]="editNetwork ? 'Passwort ändern' : (prefillSsid ? 'Verbinden: ' + prefillSsid : 'Netzwerk hinzufügen')" backHref="/wifi">
    <button type="button" class="btn-outline" (click)="cancelButtonPressed()">Abbrechen</button>
    <button type="button" class="pill-dark" [disabled]="!valid" (click)="submit(libraryForm)">
      <ion-icon name="lucide-save"></ion-icon>
      Speichern
    </button>
  </mupi-settings-header>

  <form #libraryForm="ngForm" (ngSubmit)="submit(libraryForm)" class="wifi-form">
    <div class="settings-card fields">
      @if (editNetwork) {
        <div class="settings-field">
          <label>Netzwerk</label>
          <div class="field-static">{{ editNetwork.ssid }}</div>
        </div>
      } @else {
        <div class="settings-field">
          <label for="wlan_ssid">Netzwerkname (SSID)</label>
          <ion-input id="wlan_ssid" #wlan_ssid name="wlan_ssid" type="text" placeholder="WLAN-Name eingeben" (ionInput)="inputChanged($event)" (ionFocus)="focusChanged($event)" [ngModel]="prefillSsid ?? ''"></ion-input>
        </div>
      }
      <div class="settings-field">
        <label for="wlan_pw">Passwort</label>
        <ion-input id="wlan_pw" #wlan_pw name="wlan_pw" type="text" [placeholder]="editNetwork ? 'Neues Passwort (8–63 Zeichen)' : 'Passwort, leer für offenes WLAN'" (ionInput)="inputChanged($event)" (ionFocus)="focusChanged($event)" ngModel></ion-input>
      </div>
    </div>
  </form>

  <div class="keyboard-panel" slot="fixed">
    <div class="simple-keyboard"></div>
  </div>
</ion-content>
