<ion-header class="wifi-header">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button icon="arrow-back-outline" defaultHref="/wifi"></ion-back-button>
    </ion-buttons>
    @if (editNetwork) {
      <ion-title>Change password: {{ editNetwork.ssid }}</ion-title>
    } @else {
      <ion-title>Add WiFi network</ion-title>
    }
  </ion-toolbar>
</ion-header>

<ion-content class="wifi-content">
  <div>
    <div class="top">
      <form #libraryForm="ngForm" (ngSubmit)="submit(libraryForm)">
        <ion-grid>
          @if (!editNetwork) {
            <ion-row>
              <ion-col size="12">
                <div>
                  <ion-item>
                    <ion-input #wlan_ssid name="wlan_ssid" type="text" placeholder="WLAN-SSID" (ionInput)="inputChanged($event)" (ionFocus)="focusChanged($event)" ngModel></ion-input>
                  </ion-item>
                </div>
              </ion-col>
            </ion-row>
          }
          <ion-row>
            <ion-col size="12">
              <div>
                <ion-item>
                  <ion-input #wlan_pw name="wlan_pw" type="text" placeholder="WLAN-Key" (ionInput)="inputChanged($event)" (ionFocus)="focusChanged($event)" ngModel></ion-input>
                </ion-item>
              </div>
            </ion-col>
          </ion-row>
          <ion-row>
            <ion-col size="6">
              <div>
                <div class="add-button">
                  <ion-button size="large" type="submit" expand="block" [disabled]="!valid">{{ editNetwork ? 'Save' : 'Set new WLAN' }}</ion-button>
                </div>
              </div>
            </ion-col>
            <ion-col size="6">
              <div>
                <div class="cancel-button">
                  <ion-button size="large" color="danger" (click)="cancelButtonPressed()" expand="block">Cancel</ion-button>
                </div>
              </div>
            </ion-col>
          </ion-row>
        </ion-grid>
      </form>
    </div>
  </div>

  <div class="bottom">
    <div class="simple-keyboard"></div>
  </div>
</ion-content>
