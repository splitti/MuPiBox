<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>MuPiBox</title>

	<link rel="stylesheet" href="active_theme.css">

    <base href="/" />

    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <link rel="icon" type="image/png" href="assets/icon/favicon.png" />

    <!-- The boot screen until the start page has loaded its list (see home.page.ts, class mupi-ready): between the
         boot screen and the display it was black and white for seconds. At the latest after 30 s the page shows. -->
    <link rel="preload" as="image" href="/api/bootscreen/current-splash" />
    <style>
      /* transparent under the picture: until it is there, Chromium's own background (the boot screen's colour) */
      html:not(.mupi-ready) { background: transparent url('/api/bootscreen/current-splash') center / cover no-repeat; }
      html:not(.mupi-ready) body { background: transparent !important; }
      html:not(.mupi-ready) app-root { visibility: hidden; }
    </style>
    <script>setTimeout(function () { document.documentElement.classList.add('mupi-ready') }, 30000)</script>
</head>

<body>
    <app-root></app-root>
</body>

</html>
