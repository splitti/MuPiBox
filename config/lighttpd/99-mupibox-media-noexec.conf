# MuPiBox: /cover points into the media folder (symlink /var/www/cover -> ~/MuPiBox/media/cover).
# Nothing in there may run as a script or be served as a page on the admin origin - a .php file
# placed there (e.g. through a crafted restore archive) would otherwise run as www-data, which
# has sudo. Covers are images, so these types are simply refused.
$HTTP["url"] =~ "^/cover/" {
	url.access-deny = ( ".php", ".php3", ".php4", ".php5", ".php7", ".php8", ".phtml", ".phar",
		".pht", ".pl", ".py", ".cgi", ".fcgi", ".sh", ".shtml", ".html", ".htm", ".xhtml",
		".xht", ".svg", ".svgz", ".js", ".mjs", ".xml", ".xsl", ".htaccess", ".user.ini" )
}
