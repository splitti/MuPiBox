# MuPiBox: started 45 s after the box was switched on (installed as a drop-in for lighttpd, php*-fpm, smbd and
# dietpi-dashboard, see the install/update). The box is fully busy while it starts; these services are not needed for
# the display (admin interface, Samba share, DietPi dashboard) and were competing with it. Started later on (e.g. from
# the admin interface) they start at once. ($$ = a $ for the shell, not for systemd)
[Service]
ExecStartPre=/bin/sh -c 'u=$$(cut -d. -f1 /proc/uptime); [ "$$u" -lt 45 ] && sleep $$((45 - u)); exit 0'
TimeoutStartSec=150
