[Service]
# Installed by the MuPiBox install/update as /etc/systemd/system/pm2-dietpi.service.d/override.conf.
# pm2 does not write the PIDFile the generated unit waits for (~/.pm2/pm2.pid): with Type=forking the start ran into
# its timeout, and the restart that followed killed the apps (ExecStop: pm2 kill). As oneshot no daemon PID is tracked:
# "pm2 resurrect" starts the apps and ends, the daemon lives on detached.
Type=oneshot
RemainAfterExit=yes
PIDFile=
# A resurrect that hangs (seen once: the daemon came up, the apps were never started, the display showed "503") is
# tried again instead of leaving the box without its server - a normal start takes a few seconds
Restart=on-failure
RestartSec=5
TimeoutStartSec=90
TimeoutStopSec=25
